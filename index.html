<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise For You! ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Floating Hearts Background -->
    <div class="hearts-bg">
        <div class="heart-bg">💖</div>
        <div class="heart-bg">❤️</div>
        <div class="heart-bg">💕</div>
        <div class="heart-bg">💓</div>
        <div class="heart-bg">💖</div>
    </div>

    <!-- Screen 1: Link Generator -->
    <div class="card" id="setupScreen">
        <h2>আপনার চিঠি তৈরি করুন 💌</h2>
        <p>যাকে প্রপোজ করবেন, তার জন্য চিঠি লিখুন ও ব্যাকগ্রাউন্ড মিউজিক দিন:</p>
        
        <textarea id="customLetterInput" placeholder="তোমার জন্য আমার মনের কথা..."></textarea>
        
        <input type="text" id="audioLinkInput" placeholder="Direct MP3 Link (ঐচ্ছিক)">
        <small style="display:block; text-align:left; color:#777; margin:-10px 0 12px 5px; font-size:12px;">
            *ফাঁকা রাখলে রোমান্টিক ডিফল্ট মিউজিক বাজবে।
        </small>
        
        <button id="generateBtn" onclick="generateLink()">Link তৈরি করুন 🔗</button>
        
        <div id="linkContainer" style="display: none;">
            <p>আপনার লিংক রেডি! কপি করে পাঠিয়ে দিন:</p>
            <input type="text" id="shareLink" readonly>
            <button id="copyBtn" onclick="copyLink()">Copy Link</button>
        </div>
    </div>

    <!-- Screen 1.5: Tap to Open Overlay -->
    <div id="startOverlay" style="display: none;">
        <div class="gift-box" id="openSurpriseBtn">
            <div class="gift-icon">🎁</div>
            <h3>আপনার জন্য একটি সারপ্রাইজ!</h3>
            <p>ক্লিক করে খুলুন</p>
        </div>
    </div>

    <!-- Screen 2: Proposal Screen -->
    <div class="card" id="proposalScreen" style="display: none;">
        <div class="heart-icon">💖</div>
        <h1>Do you love me? 🥺</h1>
        <div class="btn-group">
            <button id="yesBtn">Yes ❤️</button>
            <button id="noBtn">No 💔</button>
        </div>
    </div>

    <!-- Animated Letter Modal -->
    <div class="modal" id="letterModal" style="display: none;">
        <div class="letter-envelope">
            <h2 class="letter-title">I Knew It! 🎉❤️</h2>
            <div class="letter-content-box">
                <p id="letterContent"></p>
            </div>
            
            <div class="modal-buttons">
                <button class="close-btn" onclick="closeModal()">বন্ধ করুন</button>
                <button class="create-own-btn" onclick="createNew()">নিজে বানান ✍️</button>
            </div>
        </div>
    </div>

    <!-- Native HTML5 Audio Tag -->
    <audio id="bgAudio" loop></audio>

    <script src="script.js"></script>
</body>
</html>
